<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Upcoming Events - Rouse SciOly</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="card">
        <div class="content">
            <h1>Upcoming Events <img class="tab-icon" src="../assets/upcomingEvents.svg" alt=""></h1>
            <p>Don't miss what's coming up!</p>
        </div>
        <canvas id="waveCanvas"></canvas>
        <div class="about-section" id="about-section">
            <section class="event-countdown" id="event-countdown" aria-labelledby="countdown-title" hidden>
                <div class="countdown-info">
                    <span class="countdown-status" id="countdown-status">Next competition</span>
                    <h2 id="countdown-title" aria-live="polite" aria-atomic="true"></h2>
                    <p class="countdown-date" id="countdown-date"></p>
                </div>
                <div class="countdown-clock" id="countdown-clock" role="timer" aria-label="Time until the next competition" aria-live="off">
                    <div class="countdown-unit"><span class="countdown-value" id="countdown-days">00</span><span class="countdown-label">Days</span></div>
                    <div class="countdown-unit"><span class="countdown-value" id="countdown-hours">00</span><span class="countdown-label">Hours</span></div>
                    <div class="countdown-unit"><span class="countdown-value" id="countdown-minutes">00</span><span class="countdown-label">Minutes</span></div>
                    <div class="countdown-unit"><span class="countdown-value" id="countdown-seconds">00</span><span class="countdown-label">Seconds</span></div>
                </div>
                <p class="countdown-live-message" id="countdown-live-message" hidden>Good luck, Raiders!</p>
            </section>
            <div class="events-container">
                <div class="events-grid" id="events-grid">
                    <div class="events-loading">Loading events...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="event-modal-overlay" id="event-modal-overlay">
        <div class="event-modal">
            <button class="event-modal-close" id="event-modal-close">&times;</button>
            <div class="event-modal-header" id="event-modal-header"></div>
            <div class="event-modal-content">
                <h2 id="event-modal-title"></h2>
                <div class="event-modal-details">
                    <div class="event-modal-detail">
                        <span class="event-modal-icon">📅</span>
                        <span id="event-modal-date"></span>
                    </div>
                    <div class="event-modal-detail">
                        <span class="event-modal-icon">🕐</span>
                        <span id="event-modal-time"></span>
                    </div>
                    <div class="event-modal-detail">
                        <span class="event-modal-icon">📍</span>
                        <span id="event-modal-location"></span>
                    </div>
                </div>
                <p id="event-modal-description"></p>
            </div>
        </div>
    </div>

<script src="../script.js"></script>
</body>
</html>
